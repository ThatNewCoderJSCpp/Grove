name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(sed -n 's/^project(grove VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::CMakeLists.txt says VERSION $version but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

  linux:
    name: Linux ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config rpm dpkg-dev file xz-utils \
            libx11-dev libxft-dev libxrender-dev libfontconfig1-dev libfreetype-dev \
            libssl-dev libpango1.0-dev libcairo2-dev zlib1g-dev libjpeg-dev \
            libvulkan-dev libgl-dev

      - name: Configure
        run: |
          lib=/usr/lib/$(gcc -print-multiarch)
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGROVE_PACKAGE=ON -DGROVE_WITH_WALNUT=OFF -DFIZMO_TUNE=OFF \
            -DGROVE_PACKAGE_PLATFORM=linux-${{ matrix.arch }} \
            -DJPEG_LIBRARY=$lib/libjpeg.a -DJPEG_LIBRARY_RELEASE=$lib/libjpeg.a \
            -DZLIB_LIBRARY=$lib/libz.a -DZLIB_LIBRARY_RELEASE=$lib/libz.a

      - name: Build
        run: cmake --build build -j 4

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

      - name: Check grove only needs common system libraries
        run: |
          readelf -d build/grove | grep NEEDED
          if readelf -d build/grove | grep NEEDED | grep -E "libjpeg|libz\.|libstdc\+\+|libgcc_s"; then
            echo "::error::grove links to a library users may not have"
            exit 1
          fi
          if readelf -d build/grove | grep NEEDED | grep -E "libpulse|libasound"; then
            echo "::error::grove links to PulseAudio or ALSA; fizmo::audio should only load them when something plays"
            exit 1
          fi

      - name: Package
        working-directory: build
        run: cpack

      - name: Test the package
        run: |
          mkdir -p smoke
          tar -xzf build/Grove-*.tar.gz -C smoke
          smoke/Grove-*/bin/grove version
          smoke/Grove-*/bin/grove check smoke/Grove-*/examples/hello/hello.grove
          printf '<body><audio id="song" src="missing.ogg" controls /><audio_meter for="song" /></body>\n' > smoke/audio.grove
          smoke/Grove-*/bin/grove check smoke/audio.grove 2>&1 | tee smoke/audio.txt
          grep -q "can't find the audio file 'missing.ogg'" smoke/audio.txt
          printf '<body><video id="clip" src="missing.mp4" controls /></body>\n' > smoke/video.grove
          smoke/Grove-*/bin/grove check smoke/video.grove 2>&1 | tee smoke/video.txt
          grep -q "can't find the video file 'missing.mp4'" smoke/video.txt

      - name: Test the .deb
        run: |
          sudo apt-get install -y ./build/Grove-*.deb
          test -x /opt/grove/bin/grove
          test -L /usr/bin/grove
          grove version
          grove check /opt/grove/examples/hello/hello.grove
          sudo apt-get remove -y grove
          test ! -e /usr/bin/grove
          test ! -e /opt/grove/bin/grove

      - name: Check the .rpm
        run: |
          rpm -qpi build/Grove-*.rpm
          rpm -qpl build/Grove-*.rpm | grep -x /opt/grove/bin/grove
          rpm -qp --scripts build/Grove-*.rpm | grep -q "/usr/bin/grove"

      - uses: actions/upload-artifact@v4
        with:
          name: grove-linux-${{ matrix.arch }}
          path: |
            build/Grove-*.tar.gz
            build/Grove-*.tar.xz
            build/Grove-*.zip
            build/Grove-*.deb
            build/Grove-*.rpm
          compression-level: 0
          if-no-files-found: error

  linux-i686:
    name: Linux i686
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build, test, package and check in a 32-bit container
        run: |
          docker run --rm --platform linux/386 -v "$PWD:/src" -w /src i386/debian:bookworm bash -euo pipefail -c '
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates git g++ cmake ninja-build pkg-config file binutils rpm dpkg-dev xz-utils zip unzip \
              libx11-dev libxft-dev libxrender-dev libfontconfig-dev libfreetype-dev \
              libssl-dev libpango1.0-dev libcairo2-dev zlib1g-dev libjpeg-dev \
              libvulkan-dev libgl-dev
            lib=/usr/lib/$(gcc -print-multiarch)
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGROVE_PACKAGE=ON -DGROVE_WITH_WALNUT=OFF -DFIZMO_TUNE=OFF \
              -DGROVE_PACKAGE_PLATFORM=linux-i686 \
              -DJPEG_LIBRARY=$lib/libjpeg.a -DJPEG_LIBRARY_RELEASE=$lib/libjpeg.a \
              -DZLIB_LIBRARY=$lib/libz.a -DZLIB_LIBRARY_RELEASE=$lib/libz.a
            cmake --build build -j 4
            (cd build && ctest --output-on-failure)
            readelf -d build/grove | grep NEEDED
            if readelf -d build/grove | grep NEEDED | grep -E "libjpeg|libz\.|libstdc\+\+|libgcc_s"; then
              echo "::error::grove links to a library users may not have"
              exit 1
            fi
            (cd build && cpack)
            mkdir -p smoke
            tar -xzf build/Grove-*.tar.gz -C smoke
            smoke/Grove-*/bin/grove version
            smoke/Grove-*/bin/grove check smoke/Grove-*/examples/hello/hello.grove
            apt-get install -y ./build/Grove-*.deb
            test -L /usr/bin/grove
            grove version
            apt-get remove -y grove
            test ! -e /usr/bin/grove
            rpm -qpl build/Grove-*.rpm | grep -x /opt/grove/bin/grove
          '

      - uses: actions/upload-artifact@v4
        with:
          name: grove-linux-i686
          path: |
            build/Grove-*.tar.gz
            build/Grove-*.tar.xz
            build/Grove-*.zip
            build/Grove-*.deb
            build/Grove-*.rpm
          compression-level: 0
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.platform }}
    needs: version
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-w64-mingw32
            platform: windows-ucrt64
            wine: true
          - target: i686-w64-mingw32
            platform: windows-i686
            wine: false
          - target: aarch64-w64-mingw32
            platform: windows-clangarm64
            wine: false
    env:
      LLVM_MINGW: llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64
      LLVM_MINGW_URL: https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64.tar.xz
      LLVM_MINGW_TARGET: ${{ matrix.target }}
      LLVM_MINGW_DEPS: ${{ github.workspace }}/windows-deps
      WINEDEBUG: -all
      WINEPREFIX: ${{ github.workspace }}/.wineprefix
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build nsis p7zip-full zip unzip
          if [ "${{ matrix.wine }}" = "true" ]; then sudo apt-get install -y wine64; fi

      - name: Cache llvm-mingw
        id: llvm-mingw-cache
        uses: actions/cache@v4
        with:
          path: ~/llvm-mingw
          key: ${{ env.LLVM_MINGW }}

      - name: Download llvm-mingw
        if: steps.llvm-mingw-cache.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 5 --retry-delay 10 -o /tmp/llvm-mingw.tar.xz "$LLVM_MINGW_URL"
          mkdir -p ~/llvm-mingw
          tar -xf /tmp/llvm-mingw.tar.xz -C ~/llvm-mingw --strip-components=1

      - name: Put llvm-mingw on the PATH
        run: echo "$HOME/llvm-mingw/bin" >> "$GITHUB_PATH"

      - name: Cache the Windows libraries
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: windows-deps
          key: windows-deps-${{ matrix.target }}-${{ env.LLVM_MINGW }}-${{ hashFiles('.github/scripts/windows-deps.sh', 'cmake/llvm-mingw.cmake') }}

      - name: Build zlib, libjpeg-turbo and the Vulkan headers
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: bash .github/scripts/windows-deps.sh "$LLVM_MINGW_TARGET" "$LLVM_MINGW_DEPS" "$RUNNER_TEMP/windows-deps-src"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=cmake/llvm-mingw.cmake \
            -DGROVE_PACKAGE=ON -DGROVE_WITH_WALNUT=OFF -DFIZMO_TUNE=OFF \
            -DGROVE_PACKAGE_PLATFORM=${{ matrix.platform }} \
            -DJPEG_LIBRARY="$LLVM_MINGW_DEPS/lib/libjpeg.a" -DJPEG_INCLUDE_DIR="$LLVM_MINGW_DEPS/include" \
            -DZLIB_LIBRARY="$LLVM_MINGW_DEPS/lib/libzs.a" -DZLIB_INCLUDE_DIR="$LLVM_MINGW_DEPS/include"

      - name: Build
        run: cmake --build build -j 4

      - name: Test under Wine
        if: matrix.wine
        working-directory: build
        run: |
          wineboot --init || true
          ctest --output-on-failure

      - name: Check grove only needs DLLs that come with Windows
        run: |
          $LLVM_MINGW_TARGET-objdump -p build/grove.exe | grep "DLL Name"
          if $LLVM_MINGW_TARGET-objdump -p build/grove.exe | grep "DLL Name" | grep -iE "libstdc|libgcc|libwinpthread|libc\+\+|libunwind|zlib|libjpeg"; then
            echo "::error::grove needs a DLL that users will not have"
            exit 1
          fi

      - name: Package
        working-directory: build
        run: cpack

      - name: Test the package under Wine
        if: matrix.wine
        run: |
          mkdir -p smoke
          unzip -q build/Grove-*.zip -d smoke
          wine smoke/Grove-*/bin/grove.exe version
          wine smoke/Grove-*/bin/grove.exe check smoke/Grove-*/examples/hello/hello.grove
          printf '<body><audio id="song" src="missing.ogg" controls /><audio_meter for="song" /></body>\n' > smoke/audio.grove
          wine smoke/Grove-*/bin/grove.exe check smoke/audio.grove 2>&1 | tee smoke/audio.txt
          grep -q "can't find the audio file 'missing.ogg'" smoke/audio.txt
          printf '<body><video id="clip" src="missing.mp4" controls /></body>\n' > smoke/video.grove
          wine smoke/Grove-*/bin/grove.exe check smoke/video.grove 2>&1 | tee smoke/video.txt
          grep -q "can't find the video file 'missing.mp4'" smoke/video.txt

      - name: Check the 7z and the installer
        run: |
          ls -l build/Grove-*.zip build/Grove-*.7z build/Grove-*.exe
          7z l build/Grove-*.7z | grep -i "grove.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: grove-${{ matrix.platform }}
          path: |
            build/Grove-*.zip
            build/Grove-*.7z
            build/Grove-*.exe
          compression-level: 0
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: grove-tests-${{ matrix.platform }}
          path: build/grove_tests.exe
          retention-days: 3
          if-no-files-found: error

  windows-native:
    name: Run on Windows ${{ matrix.platform }}
    needs: windows
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-i686
            runner: windows-latest
          - platform: windows-clangarm64
            runner: windows-11-arm
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Examples
            Tools

      - uses: actions/download-artifact@v4
        with:
          name: grove-${{ matrix.platform }}
          path: package

      - uses: actions/download-artifact@v4
        with:
          name: grove-tests-${{ matrix.platform }}
          path: tests

      - name: Run the tests
        env:
          GROVE_EXAMPLES_DIR: ${{ github.workspace }}/Examples
        run: |
          ./tests/grove_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run the package
        run: |
          $zip = Get-ChildItem package/Grove-*.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath smoke
          $root = Get-ChildItem smoke | Select-Object -First 1
          & "$($root.FullName)/bin/grove.exe" version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$($root.FullName)/bin/grove.exe" check "$($root.FullName)/examples/hello/hello.grove"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install and uninstall with the installer
        run: |
          $exe = Get-ChildItem package/Grove-*.exe | Select-Object -First 1
          $dir = "$env:RUNNER_TEMP\GroveInstall"
          Start-Process -FilePath $exe.FullName -ArgumentList "/S", "/D=$dir" -Wait
          if (-not (Test-Path "$dir\bin\grove.exe")) { Write-Error "the installer didn't put grove.exe in $dir\bin"; exit 1 }
          & "$dir\bin\grove.exe" version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Start-Process -FilePath "$dir\Uninstall.exe" -ArgumentList "/S", "_?=$dir" -Wait
          if (Test-Path "$dir\bin\grove.exe") { Write-Error "the uninstaller left grove.exe behind"; exit 1 }

  macos:
    name: macOS ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        if: matrix.arch == 'arm64'
        run: |
          brew update
          brew install ninja pkg-config fontconfig freetype harfbuzz openssl@3 jpeg-turbo zlib vulkan-headers
          echo "FIZMO_VULKAN_INC=$(brew --prefix vulkan-headers)/include" >> "$GITHUB_ENV"

      - name: Install dependencies (Intel)
        if: matrix.arch == 'x86_64'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_UPGRADE: 1
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: |
          brew list --versions ninja pkgconf fontconfig freetype harfbuzz openssl@3 jpeg-turbo
          git clone --depth 1 --branch v1.4.363 https://github.com/KhronosGroup/Vulkan-Headers.git "$RUNNER_TEMP/vulkan-headers"
          echo "FIZMO_VULKAN_INC=$RUNNER_TEMP/vulkan-headers/include" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          prefix=$(brew --prefix)
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGROVE_PACKAGE=ON -DGROVE_WITH_WALNUT=OFF -DFIZMO_TUNE=OFF \
            -DGROVE_PACKAGE_PLATFORM=macos-${{ matrix.arch }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
            -DFIZMO_VULKAN_INCLUDE_DIR="$FIZMO_VULKAN_INC" \
            -DCMAKE_PREFIX_PATH="$prefix;$(brew --prefix jpeg-turbo);$(brew --prefix zlib)"

      - name: Build
        timeout-minutes: 120
        run: cmake --build build -j 4

      - name: Test
        timeout-minutes: 20
        working-directory: build
        run: ctest --output-on-failure --timeout 600

      - name: Package
        working-directory: build
        run: cpack

      - name: Test the archive
        run: |
          mkdir -p smoke
          tar -xzf build/Grove-*.tar.gz -C smoke
          app=$(echo smoke/Grove-*)
          otool -L $app/bin/grove
          $app/bin/grove version
          $app/bin/grove check $app/examples/hello/hello.grove
          homebrew="/opt/homebrew|/usr/local/(opt|Cellar|lib)/"
          for f in $app/bin/grove $(ls $app/bin/lib/*.dylib 2>/dev/null); do
            if otool -L "$f" | tail -n +2 | grep -E "$homebrew"; then
              echo "::error::$f still links to Homebrew's copy of a library"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: grove-macos-${{ matrix.arch }}
          path: |
            build/Grove-*.tar.gz
            build/Grove-*.tar.xz
            build/Grove-*.zip
          compression-level: 0
          if-no-files-found: error

  android:
    name: Android kit ${{ matrix.abi }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_static \
            -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON \
            -DFIZMO_TUNE=OFF -DFIZMO_BUILD_SHARED=OFF -DFIZMO_BUILD_SHADER_TOOL=OFF

      - name: Build the kit
        run: cmake --build build --target grove_android_kit -j 4

      - uses: actions/upload-artifact@v4
        with:
          name: grove-android-${{ matrix.abi }}
          path: build/kit
          if-no-files-found: error

  android-kit:
    name: Package the Android kit
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: grove-android-*
          path: kit
          merge-multiple: true

      - name: Zip it
        run: |
          version=$(sed -n 's/^project(grove VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -n 1)
          cd kit
          zip -r "../Grove-$version-android-kit.zip" lib

      - uses: actions/upload-artifact@v4
        with:
          name: grove-android-kit
          path: Grove-*-android-kit.zip
          if-no-files-found: error

  publish:
    name: Attach Grove to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, linux-i686, windows, windows-native, macos, android-kit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: grove-linux-*
          path: packages
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: grove-windows-*
          path: packages
          merge-multiple: true

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: grove-macos-*
          path: packages
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: grove-android-kit
          path: packages

      - name: List the packages
        run: |
          ls -l packages
          if ! ls packages/Grove-*-macos-* > /dev/null 2>&1; then
            echo "::warning::the macOS builds failed, so this release has no macOS packages"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: packages/Grove-*
          fail_on_unmatched_files: true
