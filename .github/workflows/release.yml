name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(sed -n 's/^project(grove VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::CMakeLists.txt says VERSION $version but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

  linux:
    name: Linux ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config \
            libx11-dev libxft-dev libxrender-dev libfontconfig1-dev libfreetype-dev \
            libssl-dev libpango1.0-dev libcairo2-dev zlib1g-dev libjpeg-dev \
            libvulkan-dev libgl-dev

      - name: Configure
        run: |
          lib=/usr/lib/$(gcc -print-multiarch)
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGROVE_PACKAGE=ON -DGROVE_WITH_WALNUT=OFF -DFIZMO_TUNE=OFF \
            -DGROVE_PACKAGE_PLATFORM=linux-${{ matrix.arch }} \
            -DJPEG_LIBRARY=$lib/libjpeg.a -DJPEG_LIBRARY_RELEASE=$lib/libjpeg.a \
            -DZLIB_LIBRARY=$lib/libz.a -DZLIB_LIBRARY_RELEASE=$lib/libz.a

      - name: Build
        run: cmake --build build -j 4

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

      - name: Check grove only needs common system libraries
        run: |
          readelf -d build/grove | grep NEEDED
          if readelf -d build/grove | grep NEEDED | grep -E "libjpeg|libz\.|libstdc\+\+|libgcc_s"; then
            echo "::error::grove links to a library users may not have"
            exit 1
          fi

      - name: Package
        working-directory: build
        run: cpack

      - name: Test the package
        run: |
          mkdir -p smoke
          tar -xzf build/Grove-*.tar.gz -C smoke
          smoke/Grove-*/bin/grove version
          smoke/Grove-*/bin/grove check smoke/Grove-*/examples/hello/hello.grove

      - uses: actions/upload-artifact@v4
        with:
          name: grove-linux-${{ matrix.arch }}
          path: build/Grove-*.tar.gz
          if-no-files-found: error

  linux-i686:
    name: Linux i686
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build, test, package and check in a 32-bit container
        run: |
          docker run --rm --platform linux/386 -v "$PWD:/src" -w /src i386/debian:bookworm bash -euo pipefail -c '
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates git g++ cmake ninja-build pkg-config file binutils \
              libx11-dev libxft-dev libxrender-dev libfontconfig-dev libfreetype-dev \
              libssl-dev libpango1.0-dev libcairo2-dev zlib1g-dev libjpeg-dev \
              libvulkan-dev libgl-dev
            lib=/usr/lib/$(gcc -print-multiarch)
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGROVE_PACKAGE=ON -DGROVE_WITH_WALNUT=OFF -DFIZMO_TUNE=OFF \
              -DGROVE_PACKAGE_PLATFORM=linux-i686 \
              -DJPEG_LIBRARY=$lib/libjpeg.a -DJPEG_LIBRARY_RELEASE=$lib/libjpeg.a \
              -DZLIB_LIBRARY=$lib/libz.a -DZLIB_LIBRARY_RELEASE=$lib/libz.a
            cmake --build build -j 4
            (cd build && ctest --output-on-failure)
            readelf -d build/grove | grep NEEDED
            if readelf -d build/grove | grep NEEDED | grep -E "libjpeg|libz\.|libstdc\+\+|libgcc_s"; then
              echo "::error::grove links to a library users may not have"
              exit 1
            fi
            (cd build && cpack)
            mkdir -p smoke
            tar -xzf build/Grove-*.tar.gz -C smoke
            smoke/Grove-*/bin/grove version
            smoke/Grove-*/bin/grove check smoke/Grove-*/examples/hello/hello.grove
          '

      - uses: actions/upload-artifact@v4
        with:
          name: grove-linux-i686
          path: build/Grove-*.tar.gz
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.platform }}
    needs: version
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-w64-mingw32
            platform: windows-ucrt64
            wine: true
          - target: i686-w64-mingw32
            platform: windows-i686
            wine: false
          - target: aarch64-w64-mingw32
            platform: windows-clangarm64
            wine: false
    env:
      LLVM_MINGW: llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64
      LLVM_MINGW_URL: https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64.tar.xz
      LLVM_MINGW_TARGET: ${{ matrix.target }}
      LLVM_MINGW_DEPS: ${{ github.workspace }}/windows-deps
      WINEDEBUG: -all
      WINEPREFIX: ${{ github.workspace }}/.wineprefix
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          if [ "${{ matrix.wine }}" = "true" ]; then sudo apt-get install -y wine64; fi

      - name: Cache llvm-mingw
        id: llvm-mingw-cache
        uses: actions/cache@v4
        with:
          path: ~/llvm-mingw
          key: ${{ env.LLVM_MINGW }}

      - name: Download llvm-mingw
        if: steps.llvm-mingw-cache.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 5 --retry-delay 10 -o /tmp/llvm-mingw.tar.xz "$LLVM_MINGW_URL"
          mkdir -p ~/llvm-mingw
          tar -xf /tmp/llvm-mingw.tar.xz -C ~/llvm-mingw --strip-components=1

      - name: Put llvm-mingw on the PATH
        run: echo "$HOME/llvm-mingw/bin" >> "$GITHUB_PATH"

      - name: Cache the Windows libraries
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: windows-deps
          key: windows-deps-${{ matrix.target }}-${{ env.LLVM_MINGW }}-${{ hashFiles('.github/scripts/windows-deps.sh', 'cmake/llvm-mingw.cmake') }}

      - name: Build zlib, libjpeg-turbo and the Vulkan headers
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: bash .github/scripts/windows-deps.sh "$LLVM_MINGW_TARGET" "$LLVM_MINGW_DEPS" "$RUNNER_TEMP/windows-deps-src"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=cmake/llvm-mingw.cmake \
            -DGROVE_PACKAGE=ON -DGROVE_WITH_WALNUT=OFF -DFIZMO_TUNE=OFF \
            -DGROVE_PACKAGE_PLATFORM=${{ matrix.platform }} \
            -DJPEG_LIBRARY="$LLVM_MINGW_DEPS/lib/libjpeg.a" -DJPEG_INCLUDE_DIR="$LLVM_MINGW_DEPS/include" \
            -DZLIB_LIBRARY="$LLVM_MINGW_DEPS/lib/libzs.a" -DZLIB_INCLUDE_DIR="$LLVM_MINGW_DEPS/include"

      - name: Build
        run: cmake --build build -j 4

      - name: Test under Wine
        if: matrix.wine
        working-directory: build
        run: |
          wineboot --init || true
          ctest --output-on-failure

      - name: Check grove only needs DLLs that come with Windows
        run: |
          $LLVM_MINGW_TARGET-objdump -p build/grove.exe | grep "DLL Name"
          if $LLVM_MINGW_TARGET-objdump -p build/grove.exe | grep "DLL Name" | grep -iE "libstdc|libgcc|libwinpthread|libc\+\+|libunwind|zlib|libjpeg"; then
            echo "::error::grove needs a DLL that users will not have"
            exit 1
          fi

      - name: Package
        working-directory: build
        run: cpack

      - name: Test the package under Wine
        if: matrix.wine
        run: |
          mkdir -p smoke
          unzip -q build/Grove-*.zip -d smoke
          wine smoke/Grove-*/bin/grove.exe version
          wine smoke/Grove-*/bin/grove.exe check smoke/Grove-*/examples/hello/hello.grove

      - uses: actions/upload-artifact@v4
        with:
          name: grove-${{ matrix.platform }}
          path: build/Grove-*.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: grove-tests-${{ matrix.platform }}
          path: build/grove_tests.exe
          retention-days: 3
          if-no-files-found: error

  windows-native:
    name: Run on Windows ${{ matrix.platform }}
    needs: windows
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-i686
            runner: windows-latest
          - platform: windows-clangarm64
            runner: windows-11-arm
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Examples
            Tools

      - uses: actions/download-artifact@v4
        with:
          name: grove-${{ matrix.platform }}
          path: package

      - uses: actions/download-artifact@v4
        with:
          name: grove-tests-${{ matrix.platform }}
          path: tests

      - name: Run the tests
        env:
          GROVE_EXAMPLES_DIR: ${{ github.workspace }}/Examples
        run: |
          ./tests/grove_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run the package
        run: |
          $zip = Get-ChildItem package/Grove-*.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath smoke
          $root = Get-ChildItem smoke | Select-Object -First 1
          & "$($root.FullName)/bin/grove.exe" version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$($root.FullName)/bin/grove.exe" check "$($root.FullName)/examples/hello/hello.grove"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  android:
    name: Android kit ${{ matrix.abi }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_static \
            -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON \
            -DFIZMO_TUNE=OFF -DFIZMO_BUILD_SHARED=OFF -DFIZMO_BUILD_SHADER_TOOL=OFF

      - name: Build the kit
        run: cmake --build build --target grove_android_kit -j 4

      - uses: actions/upload-artifact@v4
        with:
          name: grove-android-${{ matrix.abi }}
          path: build/kit
          if-no-files-found: error

  android-kit:
    name: Package the Android kit
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: grove-android-*
          path: kit
          merge-multiple: true

      - name: Zip it
        run: |
          version=$(sed -n 's/^project(grove VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -n 1)
          cd kit
          zip -r "../Grove-$version-android-kit.zip" lib

      - uses: actions/upload-artifact@v4
        with:
          name: grove-android-kit
          path: Grove-*-android-kit.zip
          if-no-files-found: error

  publish:
    name: Attach Grove to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, linux-i686, windows, windows-native, android-kit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          fail_on_unmatched_files: true
