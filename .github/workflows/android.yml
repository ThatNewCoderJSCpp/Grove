name: Android kit

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:
    inputs:
      fizmo:
        description: Fizmo branch or tag to build against
        default: dev

jobs:
  build:
    name: Android ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DGROVE_FIZMO_TAG=${{ inputs.fizmo || 'dev' }} \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_static \
            -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON \
            -DFIZMO_TUNE=OFF -DFIZMO_BUILD_SHARED=OFF -DFIZMO_BUILD_SHADER_TOOL=OFF

      - name: Build the kit
        run: cmake --build build --target grove_android_kit -j 4 -- -k 0

      - name: Check the runtime exports its entry point
        run: |
          "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" -D --defined-only build/libgrove_android.so | grep ANativeActivity_onCreate
          ls -la build/kit/lib/grove/android/${{ matrix.abi }}

      - uses: actions/upload-artifact@v4
        with:
          name: grove-android-kit-${{ matrix.abi }}
          path: build/kit
          if-no-files-found: error
